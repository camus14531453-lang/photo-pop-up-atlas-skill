<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>Pop-up game</title>
<style>
:root{color-scheme:light;font-family:system-ui,sans-serif;color:#273440;background:#ebe7df}*{box-sizing:border-box}body{margin:0}main{max-width:1200px;margin:auto;padding:20px}header{max-width:760px}h1{margin:0 0 10px;font:clamp(28px,5vw,46px) Georgia,serif}p{line-height:1.6}.stage{height:min(57vh,580px);min-height:260px;border-radius:20px;background:#cbd4d6;overflow:hidden;position:relative}canvas{display:block;width:100%;height:100%;touch-action:pan-y}button{font:inherit;min-height:44px;padding:10px 16px;border:1px solid #6b7d85;border-radius:10px;background:#fff;color:#273440;cursor:pointer}button:disabled{opacity:.5;cursor:default}button[aria-pressed=true]{background:#273440;color:white}:focus-visible{outline:3px solid #a6387b;outline-offset:4px}.controls,.choices{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}.choices button{flex:1 1 160px}#status{font-weight:650;min-height:1.6em}#notice{color:#654b24}#sound-status{font-size:.9em}.fallback .stage{display:none}.help{font-size:.9em;color:#465963}#fallback{margin-left:auto}@media(max-width:520px){main{padding:14px}.stage{height:40vh}.controls button{flex:1 1 130px}button{padding:10px}.choices button{flex-basis:100%}}
#media{display:none}.fallback #media{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px}#media figure{margin:0;padding:12px;background:#fff;border-radius:8px}#media img{display:block;max-width:100%;max-height:280px;margin:auto;object-fit:contain}#media figcaption{margin-top:8px;line-height:1.5;overflow-wrap:anywhere}[hidden]{display:none!important}.map-fallback{display:none}.fallback .map-fallback{display:block}.map-fallback img{max-width:48%;vertical-align:top}#page-title{font-size:20px}</style></head><body><main>
<header><h1 id="title"></h1><p id="intro"></p></header>
<div class="stage"><canvas id="scene" aria-label="Three-dimensional paper book. Equivalent game controls follow below."></canvas></div>
<section id="atlas-nav" hidden><h2 id="page-title"></h2><div class="controls"><button id="previous"></button><button id="next"></button><button id="reset-atlas"></button></div><p id="atlas-progress" role="status"></p></section>
<p id="notice" role="status"></p>
<div class="controls"><button id="start">Open book</button><button id="replay" disabled>Replay</button><button id="mute" aria-pressed="true">Sound off</button><button id="fallback" aria-pressed="false">Use accessible view</button></div>
<p id="status" role="status" aria-live="polite">Ready to open.</p><p id="sound-status" role="status"></p>
<div id="choices" class="choices" aria-label="Game pieces"></div>
<div id="media"></div><div class="map-fallback"><img id="map-left" hidden><img id="map-right" hidden><p id="map-clue"></p></div>
<p class="help">Select paper pieces or use the labelled buttons. Tab and Enter work throughout. Sound is optional. The accessible view uses the same rules and progress with reduced visual depth.</p>
</main>
<script id="project-data" type="application/json">__PROJECT_JSON__</script>

</body></html>
